name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Core tests
        run: ARCHIVIST_SKIP_LIVE=1 npx tsx scripts/test-all.ts
