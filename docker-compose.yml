services:
  archivist:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      ARCHIVIST_BOOTSTRAP_ON_INSTALL: "${ARCHIVIST_BOOTSTRAP_ON_INSTALL:-true}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
